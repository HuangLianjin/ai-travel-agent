name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: travel_test
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: travel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel -d travel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://travel:travel@localhost:5432/travel_test
      DATABASE_URL: postgresql://travel:travel@localhost:5432/travel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile check
        run: python -m compileall -q app scripts
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Offline eval
        run: python -m app.eval.runner --output data/eval_report.json
      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: data/eval_report.json

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f Dockerfile.prod -t ai-travel-agent:${{ github.sha }} .
